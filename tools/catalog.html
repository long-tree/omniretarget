<!doctype html><meta charset="utf-8"><title>HRI 动作结果库</title><style>body{margin:32px;background:#141b25;color:#e4edf9;font:15px system-ui}header{display:flex;gap:12px;align-items:center}input,select,button{padding:10px;border:1px solid #456;background:#243147;color:white;border-radius:6px}table{width:100%;border-collapse:collapse;margin-top:24px}td,th{text-align:left;padding:14px;border-bottom:1px solid #354053}.ready{color:#69d9ab}.failed{color:#ff947d}#message{color:#ffd38c}</style><h1>HRI 动作结果库</h1><p>数据集接触 → 人体拉普拉斯重映射 → 23DoF 基础追踪 → PAL 联合优化。点击查看，打开同步三栏 MuJoCo：小人 / 基础机器人 / PAL 机器人。机器人栏带小人虚影。</p><header><input id="query" placeholder="搜索片段 ID"><select id="action"><option value="">全部动作</option></select><select id="status"><option value="">全部状态</option><option>ready</option><option>pending</option><option>failed</option></select><button id="refresh">刷新</button><span id="count"></span></header><p id="message"></p><table><thead><tr><th>片段</th><th>动作</th><th>状态</th><th>转换耗时</th><th>查看</th></tr></thead><tbody></tbody></table><script>
const $=s=>document.querySelector(s);let rows=[];function draw(){const selected=rows.filter(r=>(!$('#action').value||r.action===$('#action').value)&&(!$('#status').value||r.status===$('#status').value)&&r.id.toLowerCase().includes($('#query').value.toLowerCase()));$('tbody').replaceChildren();$('#count').textContent=`${selected.length} / ${rows.length} 条`;for(const r of selected){const tr=document.createElement('tr');for(const text of [r.id,r.action,r.status,r.seconds?.toFixed(2)+' s']){const td=document.createElement('td');td.textContent=text;tr.append(td);}tr.children[2].className=r.status;const td=document.createElement('td'),button=document.createElement('button');button.textContent='打开三栏对比';button.disabled=r.status!=='ready';button.onclick=async()=>{const res=await fetch('/api/open',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:r.id})});$('#message').textContent=res.ok?`已启动 ${r.id} · 左键旋转 / 右键平移 / 滚轮缩放 / 空格播放暂停`:await res.text();};td.append(button);tr.append(td);$('tbody').append(tr);}}
async function load(){rows=await(await fetch('/api/clips')).json();const old=$('#action').value;$('#action').replaceChildren(new Option('全部动作',''));for(const x of [...new Set(rows.map(r=>r.action))].sort())$('#action').append(new Option(x,x));$('#action').value=old;draw();}$('#refresh').onclick=load;for(const id of ['query','action','status'])$('#'+id).oninput=draw;load();setInterval(load,15000);
</script>
